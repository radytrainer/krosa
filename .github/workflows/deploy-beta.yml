name: Deploy beta

# A push to beta: CI → build and push the three images (tag = commit sha, plus the moving tag
# "beta") → wait for approval in the `beta` environment → deploy through AWS Systems Manager.
# Manual run (Actions → Deploy beta → Run workflow, from the beta branch): go back to a release
# this server deployed before, using the image digests it recorded then (rollback).
#
# No AWS keys and no passwords live in GitHub. The `beta` environment holds three secrets:
# AWS_ROLE_ARN, AWS_REGION, EC2_INSTANCE_ID. The job gets short-lived AWS credentials through
# GitHub OIDC, and that role may only send the SSRS-Beta-Deploy document to this one instance.
on:
  push:
    branches: [beta]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit sha (40 characters) of a release this server deployed before
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # One job for the three images, so their digests can be handed to the deploy as outputs.
  images:
    name: Push images
    needs: [ci]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Image prefix
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push api
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: api
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}-api:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}-api:beta
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ssrs-api
          cache-to: type=gha,mode=max,scope=ssrs-api
      - name: Build and push worker
        id: worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: worker
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}-worker:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}-worker:beta
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ssrs-worker
          cache-to: type=gha,mode=max,scope=ssrs-worker
      - name: Build and push web
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: web
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}-web:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}-web:beta
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ssrs-web
          cache-to: type=gha,mode=max,scope=ssrs-web
      - name: Digests
        id: digests
        env:
          API: ${{ steps.api.outputs.digest }}
          WORKER: ${{ steps.worker.outputs.digest }}
          WEB: ${{ steps.web.outputs.digest }}
        run: |
          digests="$API,$WORKER,$WEB"
          if ! [[ "$digests" =~ ^sha256:[0-9a-f]{64},sha256:[0-9a-f]{64},sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::missing image digest"
            exit 1
          fi
          echo "digests=$digests" >> "$GITHUB_OUTPUT"
          { echo "### Images"; echo ""; echo "api $API"; echo ""; echo "worker $WORKER"; echo ""; echo "web $WEB"; } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to beta
    needs: [images]
    # Push: after the images. Manual run: images were built by an earlier push.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.images.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Required reviewers on this environment: the job waits here for approval before it can
    # touch the server.
    environment: beta
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Choose the image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          EVENT: ${{ github.event_name }}
          BUILT: ${{ needs.images.outputs.digests }}
        run: |
          # Push: the digests just built. Manual run (rollback): "stored", i.e. only a release the
          # server deployed before, with the digests it recorded then (never a registry tag).
          if [ "$EVENT" = workflow_dispatch ]; then
            tag="$INPUT_TAG" digests=stored
          else
            tag="$GITHUB_SHA" digests="$BUILT"
          fi
          if ! [[ "$tag" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::image_tag must be a full 40-character commit sha"
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/beta ]; then
            echo "::error::deploys run from the beta branch only"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "digests=$digests" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: ssrs-beta-deploy-${{ github.run_id }}
          role-duration-seconds: 3600

      - name: Deploy through Systems Manager
        id: deploy
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          DIGESTS: ${{ steps.tag.outputs.digests }}
        run: |
          set -euo pipefail
          # JSON, not shorthand: the digests value contains commas.
          params="$(jq -cn --arg t "$TAG" --arg d "$DIGESTS" '{ImageTag: [$t], Digests: [$d]}')"
          command_id="$(aws ssm send-command \
            --document-name SSRS-Beta-Deploy \
            --instance-ids "$INSTANCE_ID" \
            --parameters "$params" \
            --comment "deploy ${TAG:0:12} run $GITHUB_RUN_ID" \
            --timeout-seconds 600 \
            --query Command.CommandId --output text)"
          echo "SSM command $command_id"
          status=Pending
          deadline=$((SECONDS + 2400))
          while [ $SECONDS -lt $deadline ]; do
            sleep 15
            status="$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Pending | InProgress | Delayed) continue ;; *) break ;; esac
          done
          # The server scripts print no secrets (scripts/server/deploy.sh).
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text > deploy-output.txt || true
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >> deploy-output.txt || true
          cat deploy-output.txt
          result="$(sed -n 's/^DEPLOY_RESULT=//p' deploy-output.txt | tail -n 1)"
          live="$(sed -n 's/^DEPLOYED_TAG=//p' deploy-output.txt | tail -n 1)"
          previous="$(sed -n 's/^PREVIOUS_TAG=//p' deploy-output.txt | tail -n 1)"
          warning="$(sed -n 's/^DEPLOY_WARNING=//p' deploy-output.txt | tail -n 1)"
          {
            echo "### Beta deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Requested tag | \`$TAG\` |"
            echo "| Result | ${result:-unknown} (SSM status: $status) |"
            echo "| Live tag on the server | \`${live:-unknown}\` |"
            echo "| Previous tag | \`${previous:-unknown}\` |"
            if [ -n "$warning" ]; then echo "| Warning | $warning: see docs/runbook.md |"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$warning" ]; then echo "::warning::deployed, but: $warning (docs/runbook.md)"; fi
          if [ "$status" != Success ] || [ "$result" != OK ]; then
            echo "::error::deploy of $TAG did not succeed (SSM: $status, result: ${result:-none})"
            exit 1
          fi
