# Production stack (docs/deployment.md). Only Caddy publishes ports; PostgreSQL and Redis are
# reachable on the internal network only.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Order: postgres/redis healthy → migrate (one-shot) succeeds → api, worker → web → caddy.

name: ssrs

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-sa.json

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS (public host name)}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL (certificate expiry notices)}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    networks: [edge]

  web:
    build: { context: ., target: web }
    image: ${IMAGE_PREFIX:-ssrs}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      # Only used if /api requests reach Next.js directly; Caddy normally routes them to the API.
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }
    networks: [edge, internal]

  api:
    build: { context: ., target: api }
    image: ${IMAGE_PREFIX:-ssrs}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      <<: *app-env
      API_PORT: '4000'
      WEB_ORIGIN: https://${SITE_ADDRESS}
      TRUST_PROXY_HOPS: '1'
      SWAGGER_ENABLED: 'false'
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      TEMP_PASSWORD_TTL_DAYS: ${TEMP_PASSWORD_TTL_DAYS:-14}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
    secrets: [google-sa.json]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [edge, internal]

  worker:
    build: { context: ., target: worker }
    image: ${IMAGE_PREFIX:-ssrs}-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    # Lets a running sync finish on deploys (BullMQ re-delivers anything interrupted).
    stop_grace_period: 120s
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    secrets: [google-sa.json]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [internal]

  migrate:
    build: { context: ., target: migrate }
    image: ${IMAGE_PREFIX:-ssrs}-migrate:${IMAGE_TAG:-latest}
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - --appendonly
      - 'yes'
      # BullMQ requires keys never to be evicted.
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/usr/local/bin/backup.sh']
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./docker/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

secrets:
  google-sa.json:
    file: ${GOOGLE_SA_FILE:-./secrets/google-sa.json}

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  # Caddy ↔ web/api only.
  edge:
  # Application ↔ data stores; no route to the outside world is needed except Google and Sentry,
  # which go through Docker's default egress.
  internal:
