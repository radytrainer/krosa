<!doctype html>
<!--
  Shown by the service worker (public/sw.js) when a page cannot load without a connection.
  Static on purpose: no scripts, no data of any user.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Student Score Record System</title>
    <style>
      /* Light only, like the app (nothing in it sets dark mode). */
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --fg: #0f172a;
        --muted: #475569;
        --card: #ffffff;
        --border: #e2e8f0;
        --accent: #1d4ed8;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          'Noto Sans Khmer',
          'Khmer OS',
          sans-serif;
      }
      main {
        max-width: 24rem;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
      }
      a {
        color: var(--accent);
        font-weight: 600;
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Results need an internet connection. Check your Wi-Fi or mobile data, then try again.</p>
      <p><a href="/">Try again</a></p>
    </main>
  </body>
</html>
